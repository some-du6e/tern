<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tern</title>
<style>
  :root {
    --bg: #0d0e10; --panel: #15171a; --line: #24272c; --text: #e6e6e6; --dim: #8b9099;
    --accent: #7aa2ff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --user: #1d2433;
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: var(--line); border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { filter: brightness(1.25); }
  button.primary { background: var(--accent); color: #0b1020; font-weight: 600; }
  button.danger { background: #3a1d1d; color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  .hidden { display: none !important; }
  .dim { color: var(--dim); }

  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  header b { letter-spacing: .5px; }
  header .spacer { flex: 1; }
  #net { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  #signin { margin: auto; width: min(360px, 92vw); display: flex; flex-direction: column; gap: 10px; }
  #signin h1 { font-size: 20px; margin: 0 0 4px; }
  #signin .row { display: flex; gap: 8px; }
  #signin .row > * { flex: 1; }

  #app { flex: 1; display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 0; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  #envs { padding: 8px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .env { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .env:hover, .thread:hover { background: #1c1f23; }
  .env.on { background: #20252d; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.online { background: var(--ok); } .dot.offline { background: var(--bad); } .dot.busy { background: var(--warn); }
  #filter { margin: 8px; }
  #threads { overflow-y: auto; flex: 1; padding: 0 6px 12px; }
  .project { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); padding: 12px 8px 4px; }
  .thread { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr; gap: 0 8px; align-items: center; }
  .thread.on { background: #20252d; }
  .thread .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread .p { grid-column: 2; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #back { display: none; }
  #thead { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  #ttitle { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 820px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); padding: 8px 12px; border-radius: 10px; }
  .msg.system { color: var(--dim); font-size: 12px; }
  .msg.streaming::after { content: " ▍"; color: var(--accent); }
  .msg code { background: #1c1f23; padding: 1px 4px; border-radius: 4px; }
  .msg pre { background: #111316; border: 1px solid var(--line); padding: 10px; border-radius: 6px; overflow-x: auto; }
  .msg.tool { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); white-space: normal; }
  .msg.tool summary { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg.tool.running summary::after { content: " …"; color: var(--accent); }
  .msg.tool.failed summary { color: var(--bad); }
  .msg.thought { flex: none; color: var(--dim); font-size: 13px; cursor: pointer; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .msg.thought[data-open] { display: block; }
  .msg.thought b { color: var(--text); font-weight: 600; }
  .msg.thought pre { font-size: 12px; }
  .msg.thought.live b { background: linear-gradient(90deg, var(--dim) 30%, var(--text) 50%, var(--dim) 70%) 0 0 / 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .msg.fold { color: var(--dim); cursor: pointer; padding-bottom: 8px; border-bottom: 1px solid var(--line); align-self: stretch; max-width: none; }
  .msg.fold:hover { color: var(--text); }
  .msg.error { color: var(--bad); background: #2a1515; padding: 8px 12px; border-radius: 8px; }
  .more { align-self: center; font-size: 12px; }
  .msg.tool pre { white-space: pre-wrap; max-height: 360px; overflow: auto; margin: 6px 0 0; }
  #attach { background: var(--line); border-radius: 6px; width: 44px; display: grid; place-items: center; font-size: 20px; cursor: pointer; flex: none; }
  #pending { display: flex; gap: 8px; padding: 8px 16px 0; flex-wrap: wrap; }
  #pending img { height: 56px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }
  #suggest { margin: 0 16px; max-height: 260px; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; }
  #suggest > .dim { padding: 6px 8px; }
  #suggest .pick { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; }
  #suggest .pick b { font-weight: 600; flex: none; }
  #suggest .pick .dim { overflow: hidden; text-overflow: ellipsis; min-width: 0; font-size: 12px; }
  #suggest .pick.on, #suggest .pick:hover { background: #20252d; }
  #sidetools { display: flex; gap: 6px; margin: 8px; }
  #sidetools input { flex: 1; min-width: 0; }
  .foot { margin: 6px 8px 8px; background: transparent; color: var(--dim); text-align: left; }
  .project { display: flex; align-items: center; }
  .project span { flex: 1; }
  .project button { padding: 0 6px; background: transparent; color: var(--dim); font-size: 14px; }
  .thread.unread .t { font-weight: 700; }
  .thread .pin { color: var(--dim); font-size: 11px; }
  .more-settled { font-size: 12px; color: var(--dim); padding: 4px 8px 4px 26px; cursor: pointer; }
  .match .p { white-space: normal; }
  .match mark { background: none; color: var(--accent); }
  #thead { position: relative; }
  #ttitle { cursor: text; }
  .pop { position: absolute; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px;
         box-shadow: 0 8px 24px #0008; max-height: 60vh; overflow-y: auto; }
  #menupop { right: 12px; top: 100%; min-width: 200px; }
  .pop .item { padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .pop .item:hover { background: #20252d; }
  .pop .item.on::before { content: "✓ "; }
  .pop .group { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); padding: 8px 10px 2px; }
  .pop .item.bad { color: var(--bad); }
  .pop .opts { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); margin-top: 4px; }
  .pop .opts label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  #toolbar { position: relative; display: flex; gap: 6px; padding: 8px 16px 0; align-items: center; flex-wrap: wrap; }
  #toolbar button, #toolbar select { font-size: 12px; padding: 4px 10px; }
  #toolbar select { background: var(--line); border: 0; border-radius: 6px; }
  #plan.on { background: var(--accent); color: #0b1020; }
  #modelpop { left: 16px; bottom: 100%; width: min(380px, 92vw); }
  #queue, #questions { margin: 8px 16px 0; display: flex; flex-direction: column; gap: 6px; }
  .queued { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border: 1px dashed var(--line); border-radius: 8px; }
  .queued span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queued button { font-size: 12px; padding: 3px 8px; }
  .question { border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .question .h { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--dim); }
  .question .choices { display: flex; flex-wrap: wrap; gap: 6px; }
  .question .choices button.on { background: var(--accent); color: #0b1020; }
  .question .row { display: flex; gap: 6px; justify-content: flex-end; }
  #planbar { margin: 8px 16px 0; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 8px; display: flex; gap: 8px; align-items: flex-start; }
  #planbar details { flex: 1; min-width: 0; }
  #planbar summary { cursor: pointer; font-weight: 600; }
  #planbar .msg { max-height: 40vh; overflow-y: auto; margin-top: 6px; font-size: 13px; }
  #diffview { position: fixed; inset: 5vh 5vw; z-index: 20; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; box-shadow: 0 12px 40px #000a; }
  #diffview .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #diffview .spacer { flex: 1; }
  #diffbody { flex: 1; overflow: auto; margin: 0; padding: 10px 12px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #diffbody .a { color: var(--ok); } #diffbody .d { color: var(--bad); } #diffbody .h { color: var(--accent); } #diffbody .f { color: var(--text); font-weight: 600; }
  #approval { margin: 0 16px 8px; padding: 10px 12px; border: 1px solid var(--warn); border-radius: 8px; display: flex; gap: 8px; align-items: center; }
  #approval span { flex: 1; }
  #composer { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  #composer textarea { flex: 1; resize: none; height: 44px; max-height: 200px; }
  #empty { margin: auto; color: var(--dim); }
  #err { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #3a1d1d; color: var(--bad);
         padding: 8px 14px; border-radius: 8px; max-width: 90vw; cursor: pointer; }

  @media (max-width: 720px) {
    #app { grid-template-columns: minmax(0, 1fr); }
    #back { display: inline-block; }
    #runtime { max-width: 120px; }
    header .tag { display: none; }
    header { padding: 6px 10px; }
    #app.thread-open aside { display: none; }
    #app:not(.thread-open) main { display: none; }
  }
</style>
</head>
<body>
<header>
  <b>tern</b><span class="dim tag">T3 Connect PoC</span>
  <span class="spacer"></span>
  <span id="net" class="dim"></span>
  <button id="signout" class="hidden">Sign out</button>
</header>

<form id="signin" class="hidden" autocomplete="on">
  <h1>Sign in to T3 Connect</h1>
  <span class="dim">Same account as app.t3.codes. The code goes to your email.</span>
  <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
  <input id="code" class="hidden" inputmode="numeric" placeholder="6-digit code" autocomplete="one-time-code">
  <input id="password" class="hidden" type="password" placeholder="Password" autocomplete="current-password">
  <div class="row">
    <button id="go" class="primary" type="submit">Continue</button>
    <button id="usepw" class="hidden" type="button">Use password</button>
  </div>
</form>

<div id="app" class="hidden">
  <aside>
    <div id="envs"></div>
    <div id="sidetools">
      <input id="filter" placeholder="Search threads" type="search">
      <button id="newthread" title="New thread">+</button>
    </div>
    <div id="threads"></div>
    <button id="archived" class="foot">Archived</button>
  </aside>
  <main>
    <div id="thead" class="hidden">
      <button id="back">←</button>
      <span id="ttitle" title="Rename"></span>
      <select id="draftproject" class="hidden"></select>
      <span id="tstatus" class="dim"></span>
      <button id="stop" class="danger hidden">Stop</button>
      <button id="menu" title="Thread actions">⋯</button>
      <div id="menupop" class="pop hidden"></div>
    </div>
    <div id="messages"><div id="empty">Pick a thread.</div></div>
    <div id="approval" class="hidden">
      <span id="approvalText"></span>
      <button class="primary" data-decision="accept">Approve</button>
      <button data-decision="acceptForSession">For session</button>
      <button class="danger" data-decision="decline">Decline</button>
    </div>
    <div id="questions" class="hidden"></div>
    <div id="queue" class="hidden"></div>
    <div id="planbar" class="hidden"></div>
    <div id="pending" class="hidden"></div>
    <div id="suggest" class="hidden"></div>
    <div id="toolbar" class="hidden">
      <button id="model" type="button" title="Model"></button>
      <button id="plan" type="button" title="Plan mode: the agent proposes a plan before changing anything">Plan</button>
      <select id="runtime" title="Permissions">
        <option value="approval-required">Ask first</option>
        <option value="auto-accept-edits">Auto-accept edits</option>
        <option value="auto">Auto</option>
        <option value="full-access">Full access</option>
      </select>
      <div id="modelpop" class="pop hidden"></div>
    </div>
    <form id="composer" class="hidden">
      <label id="attach" title="Attach image">+<input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden></label>
      <textarea id="input" placeholder="Message" enterkeyhint="enter"></textarea>
      <button id="queuebtn" class="hidden" type="submit" data-queue="1" title="Send after the current turn (Alt+Enter)">Queue</button>
      <button class="primary" type="submit">Send</button>
    </form>
  </main>
</div>
<div id="diffview" class="hidden">
  <div class="bar"><b id="difftitle"></b><span class="spacer"></span><button id="diffclose">Close</button></div>
  <pre id="diffbody"></pre>
</div>
<div id="err" class="hidden"></div>
<script type="module" src="app.js"></script>
</body>
</html>
